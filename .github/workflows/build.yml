name: build-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install bubblewrap
        run: npm i -g @bubblewrap/cli
      - name: create keystore
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: keytool -genkeypair -keystore android.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" -alias android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Zik Chat"
      - name: init project
        run: |
          yes | bubblewrap init --manifest https://zik-chat.a23681982.workers.dev/manifest.webmanifest || true
      - name: build apk
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KS_PASS }}
        run: yes | bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: zik-chat-apk
          path: "*.apk"
